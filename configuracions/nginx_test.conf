user nginx;
worker_processes auto;

events {
        worker_connections 768;
        # multi_accept on;
}

http {

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;
        # server_tokens off;

        server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        ##
        # Gzip Settings
        ##

        gzip on;

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Virtual Host Configs
        ##

        server {
          listen 80;
            server_name 37.187.80.103;
            client_max_body_size 100M;
            proxy_read_timeout 600;
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            return 301 https://37.187.80.103:443$request_uri;
        }
        server {
          listen 443;
          ssl on;
          ssl_certificate /var/ssl/certs/cert.crt;
          ssl_certificate_key /var/ssl/certs/cert.key;
          client_max_body_size 100M;
          proxy_read_timeout 600;
          proxy_connect_timeout 600;
          proxy_send_timeout 600;

          # send headers in one peace
          tcp_nopush on;
          # allow the server to close connection on non responding client, this will free up memory
          reset_timedout_connection on;
          # request timed out -- default 60
          client_body_timeout 20;
          # if client stop responding, free up memory -- default 60
          send_timeout 20;
          # server will close connection after this time -- default 75
          keepalive_timeout 40;
          # reduce the data that needs to be sent over network
          gzip on;
          gzip_min_length 200;
          gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/x-javascript
            application/json
            application/x-web-app-manifest+json
            application/xml
            application/xhtml+xml
            application/x-font-ttf
            application/octet-stream
            font/opentype
            image/x-icon
            image/svg+xml;
          gzip_proxied expired no-cache no-store private auth;
          gzip_http_version 1.1;
          gzip_comp_level 5;
          gzip_vary on;
          gzip_disable msie6;

          location / {
            try_files $uri $uri/ /index.html;
          }

          location /apptest {
            alias /usr/share/nginx/html/app/;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
          }

          location /apptest/apiKaircen {
            proxy_pass http://37.187.80.103:7002/api/v1;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
          }
        
        }

}
