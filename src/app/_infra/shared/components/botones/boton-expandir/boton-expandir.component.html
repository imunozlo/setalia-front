<i
  nz-icon
  nzType="down"
  *ngIf="expandido"
  nzTheme="outline"
  style="font-size: 16px; cursor: pointer"
  (click)="this.cambiarEstado()"
></i>
<i
  nz-icon
  nzType="right"
  *ngIf="!expandido"
  nzTheme="outline"
  style="font-size: 16px; cursor: pointer"
  (click)="this.cambiarEstado()"
></i>
