<nz-card class="card-fotos">
  <div #contenedorFotosFullscreen class="contenedor-fotos-completo">
    <input
      #inputFotos
      type="file"
      accept="image/png,image/jpeg,image/webp"
      multiple
      hidden
      (change)="onFotosSeleccionadas($event)"
    />

    <div class="toolbar-fotos" *ngIf="!soloLectura || previews.length > 0">
      <div class="toolbar-fotos__der">
        <lib-boton
          *ngIf="!soloLectura"
          (click)="abrirSelector()"
          [disabled]="!puedeSubir"
          [titulo]="'Añadir fotos'">
        </lib-boton>

        <button
          *ngIf="previews.length > 0"
          type="button"
          class="accion-icono"
          (click)="toggleFullscreenFotos()"
          [title]="fotosFullscreen ? 'Salir de pantalla completa' : 'Maximizar fotos'"
          [attr.aria-label]="fotosFullscreen ? 'Salir de pantalla completa' : 'Maximizar fotos'">
          <span
            nz-icon
            [nzType]="fotosFullscreen ? 'fullscreen-exit' : 'fullscreen'"
            nzTheme="outline">
          </span>
        </button>
      </div>
    </div>

    <div *ngIf="!identificacionId" class="sin-fotos">
      Guarda primero la solicitud para poder subir fotos.
    </div>

    <div *ngIf="identificacionId && cargandoPreviews" class="sin-fotos">
      Cargando fotos...
    </div>

    <div
      *ngIf="identificacionId && !cargandoPreviews && previews.length; else vacioConId"
      class="visor-fotos">

      <div class="visor-simple" *ngIf="fotoActual as foto">
        <div class="slide-foto">
          <img
            class="slide-foto__imagen"
            [src]="foto.src"
            [alt]="foto.nombreArchivo || ('Foto ' + (indiceActual + 1))"
          />

          <button
            *ngIf="!soloLectura && previews.length > 0"
            type="button"
            class="eliminar-foto"
            (click)="eliminarActual()"
            [disabled]="eliminando"
            title="Eliminar foto actual"
            aria-label="Eliminar foto actual">
            <span nz-icon nzType="delete" nzTheme="outline"></span>
          </button>

          <button
            *ngIf="previews.length > 1"
            type="button"
            class="navegacion-foto navegacion-foto--anterior"
            (click)="anterior()"
            title="Foto anterior"
            aria-label="Foto anterior">
            <span nz-icon nzType="left" nzTheme="outline"></span>
          </button>

          <button
            *ngIf="previews.length > 1"
            type="button"
            class="navegacion-foto navegacion-foto--siguiente"
            (click)="siguiente()"
            title="Foto siguiente"
            aria-label="Foto siguiente">
            <span nz-icon nzType="right" nzTheme="outline"></span>
          </button>

          <div class="contador-foto" *ngIf="previews.length > 1">
            Foto {{ indiceActual + 1 }} de {{ previews.length }}
          </div>
        </div>

        <div class="miniaturas" *ngIf="previews.length > 1">
          <button
            type="button"
            class="miniatura"
            *ngFor="let item of previews; let i = index"
            [class.miniatura--activa]="i === indiceActual"
            (click)="irA(i)"
          >
            <img
              [src]="item.src"
              [alt]="item.nombreArchivo || ('Miniatura ' + (i + 1))"
            />
          </button>
        </div>
      </div>
    </div>

    <ng-template #vacioConId>
      <div *ngIf="identificacionId && !cargandoPreviews" class="sin-fotos">
        No hay fotos todavía
      </div>
    </ng-template>
  </div>
</nz-card>
